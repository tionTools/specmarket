name: Patch 73 registry unpaid validation

on:
  push:
    branches:
      - patch73-registry-unpaid-validation2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Patch 73 from exact current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '896bad13fe7bc68580e60f3816e990f0b895d570'
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/HomeView.vue')
          source = path.read_text(encoding='utf-8')
          old = "    isPromRegistryDraft.value = true\n    searchQuery.value = ''\n    platformFilter.value = 'all'\n    isShowingCancellations.value = false\n    isShowingReturns.value = false\n"
          new = "    isPromRegistryDraft.value = true\n    searchQuery.value = ''\n    platformFilter.value = 'all'\n    isShowingCancellations.value = false\n    isShowingReturns.value = false\n    isShowingUnpaidOnly.value = false\n"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Patch 73 anchor count={count}, expected 1')
          source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = 'src/pages/HomeView.vue'
          grep -F "isShowingUnpaidOnly.value = false" src/pages/HomeView.vue >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm format
          git checkout HEAD -- src/features/orders/delivery-tracking.ts
          pnpm type-check
          pnpm lint
          pnpm build
          git checkout HEAD -- src/features/orders/delivery-tracking.ts
          git diff --check
          test "$(git diff --name-only)" = 'src/pages/HomeView.vue'
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/'
          ! git diff --name-only | grep -E '^android/'

      - name: Normalize and reapply Patch 73
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary --full-index -- src/pages/HomeView.vue > /tmp/73.patch
          test -s /tmp/73.patch
          git reset --hard HEAD
          git clean -fd
          git apply --check /tmp/73.patch
          git apply /tmp/73.patch
          git diff --check
          test "$(git diff --name-only)" = 'src/pages/HomeView.vue'
          pnpm type-check
          pnpm lint
          pnpm build
          git checkout HEAD -- src/features/orders/delivery-tracking.ts
          git diff --check
          test "$(git diff --name-only)" = 'src/pages/HomeView.vue'
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/'
          ! git diff --name-only | grep -E '^android/'

      - uses: actions/upload-artifact@v4
        with:
          name: patch73-registry-unpaid
          path: /tmp/73.patch
          if-no-files-found: error
