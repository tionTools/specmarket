name: Publish Patch 62

on:
  push:
    branches: [chatgpt-validate-62]
    paths:
      - '.github/workflows/patch62-publish.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: c339ec736e4a0cfde1cb34619125e0b68b411167
      VALIDATION_RUN: '34156217806'
      PATCH_SHA256: c6a48ef286b71df7db27904a420b776729301c599a0aa0a15d08d2b260d6a167
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify validated source and current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(gh run view "$VALIDATION_RUN" --json conclusion --jq '.conclusion')" = success
          git fetch origin main chatgpt-patches
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Download exact validated canonical patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/patch62-artifact
          gh run download "$VALIDATION_RUN" -n patch62-canonical -D /tmp/patch62-artifact
          test -s /tmp/patch62-artifact/PATCH62-CANONICAL.patch
          echo "$PATCH_SHA256  /tmp/patch62-artifact/PATCH62-CANONICAL.patch" | sha256sum -c -

      - name: Publish Patch 62 and Codex instruction
        shell: bash
        run: |
          git worktree add --detach /tmp/patch62-patches origin/chatgpt-patches
          cp /tmp/patch62-artifact/PATCH62-CANONICAL.patch \
            /tmp/patch62-patches/62-follow-nova-cargo-return.patch
          cat > /tmp/patch62-patches/62-follow-nova-cargo-return.txt <<'EOF'
          PATCH 62 — Nova Poshta CargoReturn tracking

          База patch: main commit c339ec736e4a0cfde1cb34619125e0b68b411167.

          Действуй только механически. Ничего не исследуй, не проектируй и не исправляй самостоятельно.

          1. Перейди в:
             C:\Users\Вадим\Documents\CRM моя\specmarket

          2. Выполни:
             git fetch origin main chatgpt-patches
             git rev-parse origin/main

             Ожидается ровно:
             c339ec736e4a0cfde1cb34619125e0b68b411167

             Если SHA другой — остановись и сообщи только новый SHA. Patch не применять.

          3. Выполни:
             git switch main
             git merge --ff-only origin/main

          4. Не трогай AGENTS.md и любые существующие посторонние local/untracked файлы.

          5. Получи patch:
             git show origin/chatgpt-patches:62-follow-nova-cargo-return.patch > .git/PATCH62.patch

          6. Выполни:
             git apply --check .git/PATCH62.patch
             git apply .git/PATCH62.patch
             git diff --check

             Если git apply --check или применение не прошло — остановись. Ничего не исправляй.

          7. Добавь в commit ТОЛЬКО:
             supabase/functions/sync-delivery-tracking/carriers/nova-poshta.ts
             supabase/functions/sync-delivery-tracking/carriers/nova-return_test.ts
             supabase/functions/sync-delivery-tracking/storage.ts
             supabase/functions/sync-delivery-tracking/storage_return_test.ts

          8. Проверь:
             git diff --cached --name-only

             В staged должны быть ровно эти 4 файла. AGENTS.md не добавлять.

          9. Commit и push:
             git commit -m "Follow Nova Poshta CargoReturn tracking"
             git push origin main

          10. После успешного push задеплой только изменённую Edge Function:
              pnpm exec supabase functions deploy sync-delivery-tracking

              Если deploy завершился ошибкой — не исследуй причину, просто сообщи ошибку.

          11. Ничего больше не запускать. Все regression-тесты, Deno check, live Nova Poshta control и чистое повторное применение canonical patch уже независимо проверены.

          12. Сообщи только:
              - commit SHA;
              - успешен ли push;
              - успешен ли deploy sync-delivery-tracking;
              - итог git status --short.

          Не запускать Deno. Не менять AGENTS.md.
          EOF
          cd /tmp/patch62-patches
          git config user.name 'chatgpt-patches'
          git config user.email 'chatgpt-patches@users.noreply.github.com'
          git add 62-follow-nova-cargo-return.patch 62-follow-nova-cargo-return.txt
          git commit -m 'Add validated Patch 62'
          git push origin HEAD:chatgpt-patches
