name: Validate Patch 77
on:
  push:
    branches:
      - chatgpt-validation-77
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Patch 77 source changes
        run: |
          set -euo pipefail
          python .github/patch77/prepare.py
          git add -N supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed frontend files
        run: pnpm exec oxfmt src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Type check
        run: pnpm type-check
      - name: Lint changed frontend files
        run: |
          pnpm exec oxlint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
          pnpm exec eslint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Build
        run: pnpm build
      - name: Verify final scope and generated patch applicability
        run: |
          set -euo pipefail
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
          git diff --binary 8e5986b267d0ddce93fd78b4c5b9a78898db0b84 -- \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql \
            > .github/patch77/generated-77.patch
          test -s .github/patch77/generated-77.patch
          git worktree add --detach /tmp/specmarket-p77-check 8e5986b267d0ddce93fd78b4c5b9a78898db0b84
          git -C /tmp/specmarket-p77-check apply --check "$GITHUB_WORKSPACE/.github/patch77/generated-77.patch"
          git worktree remove /tmp/specmarket-p77-check
      - name: Publish generated validation patch if changed
        run: |
          set -euo pipefail
          git add .github/patch77/generated-77.patch
          if git diff --cached --quiet; then
            echo 'Validated patch content unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh validated Patch 77 [skip ci]'
          git push origin HEAD:chatgpt-validation-77
