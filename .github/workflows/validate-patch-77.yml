name: Validate and publish Patch 77
on:
  push:
    branches:
      - chatgpt-validation-77
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean Patch 77 worktree from main base
        shell: bash
        run: |
          set -euo pipefail
          cp .github/patch77/prepare.py /tmp/prepare-p77.py
          git checkout --detach 8e5986b267d0ddce93fd78b4c5b9a78898db0b84
          python /tmp/prepare-p77.py
          git add -N supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed frontend files
        run: pnpm exec oxfmt src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Type check
        run: pnpm type-check
      - name: Lint changed frontend files
        run: |
          pnpm exec oxlint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
          pnpm exec eslint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Build
        run: pnpm build
      - name: Verify final scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
      - name: Commit and publish ready Patch 77
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add currency-aware reconciliation storno'
          git push origin HEAD:patch-77-ready
