name: Validate Patch 77
on:
  push:
    branches:
      - chatgpt-validation-77
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Patch 77
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patch77/77.patch
          git apply .github/patch77/77.patch
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec oxfmt --check src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Type check
        run: pnpm type-check
      - name: Lint changed frontend files
        run: |
          pnpm exec oxlint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
          pnpm exec eslint src/pages/ReconciliationView.vue src/features/reconciliation/ReconciliationHistoryTable.vue src/features/reconciliation/types.ts
      - name: Build
        run: pnpm build
      - name: Final scope check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            src/pages/ReconciliationView.vue \
            src/features/reconciliation/ReconciliationHistoryTable.vue \
            src/features/reconciliation/types.ts \
            supabase/migrations/20260912100000_reconciliation_usd_adjustment.sql | sort)
          test "$actual" = "$expected"
