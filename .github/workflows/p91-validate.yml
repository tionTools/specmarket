name: Patch 91 validation

on:
  push:
    branches: [chatgpt-p91-validate]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Patch 91 base
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch patch transport branch
        run: git fetch origin chatgpt-patches:refs/remotes/origin/chatgpt-patches

      - name: Verify base and patch blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bfeb68e0cd586d38bf6594e939537e9f6e79cea8"
          test "$(git rev-parse origin/chatgpt-patches:91.patch)" = "d94183df77eabe6fa4d12d1e35f4f77c482bca06"
          git show origin/chatgpt-patches:91.patch > "$RUNNER_TEMP/91.patch"
          git apply --check "$RUNNER_TEMP/91.patch"

      - name: Apply patch and verify scope
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/91.patch"
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/actual-scope.txt"
          cat > "$RUNNER_TEMP/expected-scope.txt" <<'EOF'
          android/app/build.gradle.kts
          android/app/google-services.json
          android/app/src/main/AndroidManifest.xml
          android/app/src/main/java/ua/orders/crm/OrderNotification.kt
          android/app/src/main/java/ua/orders/crm/OrdersRepository.kt
          android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt
          android/app/src/main/java/ua/orders/crm/PushMessaging.kt
          android/app/src/test/java/ua/orders/crm/PushMessagingTest.kt
          android/build.gradle.kts
          supabase/functions/_shared/firebase-messaging.ts
          supabase/functions/_shared/firebase-messaging_test.ts
          supabase/functions/manage-push-device/index.ts
          supabase/functions/send-order-push/index.ts
          supabase/migrations/20260916160000_order_push_notifications.sql
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected-scope.txt"
          sort -o "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/expected-scope.txt"
          diff -u "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/actual-scope.txt"
          git status --short

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate push Edge Function code
        run: |
          deno test supabase/functions/_shared/firebase-messaging_test.ts
          deno check supabase/functions/_shared/firebase-messaging.ts supabase/functions/manage-push-device/index.ts supabase/functions/send-order-push/index.ts
          rm -f deno.lock

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Android tests lint and release build
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Final diff verification
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > "$RUNNER_TEMP/final-scope.txt"
          diff -u "$RUNNER_TEMP/expected-scope.txt" "$RUNNER_TEMP/final-scope.txt"
