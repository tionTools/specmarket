name: Patch 63 Validation

on:
  push:
    branches: [chatgpt-validate-63]
    paths:
      - '.github/workflows/patch63-validate.yml'
      - '.github/patch63-materialize.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: f3c0dfcddf3be7a2e0e2a1ad5d4110246f44ecbb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify current main base
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"

      - name: Materialize planned Android 0.4 changes
        shell: bash
        run: |
          python .github/patch63-materialize.py
          git diff --check

      - name: Validate exact diff scope
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          android/app/build.gradle.kts
          android/app/src/main/java/ua/orders/crm/MainActivity.kt
          android/app/src/main/java/ua/orders/crm/OrderModels.kt
          android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt
          android/app/src/test/java/ua/orders/crm/OrderModelsTest.kt
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -Fx 'AGENTS.md' /tmp/changed.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3

      - name: Android regression tests, lint and build
        working-directory: android
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Static control assertions
        shell: bash
        run: |
          grep -F 'versionCode = 4; versionName = "0.4"' android/app/build.gradle.kts
          grep -F 'DeliveryStatus(order, compact = true)' android/app/src/main/java/ua/orders/crm/MainActivity.kt
          grep -F 'Текущий статус:' android/app/src/main/java/ua/orders/crm/MainActivity.kt
          grep -F 'ordersBeforeDetail = orders' android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt
          grep -F 'orders = sortOrdersForDisplay(ordersDuringDetailRefresh(orders, batch, selectedId != null))' android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt
          grep -F 'orders = ordersAfterClosingDetail(orders, ordersBeforeDetail)' android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt
          test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build canonical Patch 63 and clean re-apply
        shell: bash
        run: |
          git diff -- \
            android/app/build.gradle.kts \
            android/app/src/main/java/ua/orders/crm/MainActivity.kt \
            android/app/src/main/java/ua/orders/crm/OrderModels.kt \
            android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt \
            android/app/src/test/java/ua/orders/crm/OrderModelsTest.kt \
            > /tmp/PATCH63-CANONICAL.patch
          test -s /tmp/PATCH63-CANONICAL.patch
          git worktree add /tmp/patch63-base "$BASE_SHA"
          cd /tmp/patch63-base
          git apply --check /tmp/PATCH63-CANONICAL.patch
          git apply /tmp/PATCH63-CANONICAL.patch
          git diff --check
          git diff --name-only | sort > /tmp/reapplied.txt
          diff -u /tmp/expected.txt /tmp/reapplied.txt
          cp /tmp/PATCH63-CANONICAL.patch "$GITHUB_WORKSPACE/PATCH63-CANONICAL.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: patch63-canonical
          path: PATCH63-CANONICAL.patch
          if-no-files-found: error
