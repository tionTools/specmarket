name: Android 0.36 reminders launch smoke
on:
  push:
    branches: [feature/android-reminder-filter-v036, feature/android-pickup-reminders-v048, feature/android-pickup-reminders-v049]
    paths:
      - '.github/workflows/android-036-launch-smoke.yml'
      - 'android/**'
permissions:
  contents: read
jobs:
  emulator:
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=+android_emulator"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug package
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/launch-smoke-036.sh
      - name: Upload runtime diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-036-runtime-api${{ matrix.api-level }}
          path: |
            validation/036-*.txt
            validation/036-reminders.png
            validation/036-after-manual.png
            validation/036-after-manual.xml
          retention-days: 7
