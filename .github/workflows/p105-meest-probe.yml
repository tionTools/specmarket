name: Patch 105 Meest live probe

on:
  push:
    branches: [chatgpt-p105-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current Meest public tracking
        shell: bash
        run: |
          set -u
          ttn='723-3447567'

          curl -L --max-time 20 -sS "https://t.meest-group.com/n/${ttn}" -o /tmp/n.html
          salt=$(grep -oE "var salt = '[0-9a-f]+'" /tmp/n.html | head -n1 | sed -E "s/.*'([0-9a-f]+)'.*/\1/")
          echo "salt_length=${#salt}"
          chk=$(printf '%s' "${salt}${ttn}${salt}" | md5sum | awk '{print $1}')

          echo '=== signed public tracking XML ==='
          code=$(curl -L --max-time 20 -sS -X POST \
            -D /tmp/tracking.headers -o /tmp/tracking.xml -w '%{http_code}' \
            "https://t.meest-group.com/get.php?what=tracking&test&number=${ttn}&lang=uk&ext_track=&chk=${chk}" || true)
          echo "HTTP ${code}"
          sed -n '1,20p' /tmp/tracking.headers || true
          echo '--- XML ---'
          cat /tmp/tracking.xml || true
          echo
          echo '=== extracted fields ==='
          grep -oE '<(DateTimeAction|ActionMessages|DetailMessages|Country|City|StatusCode)>[^<]*</(DateTimeAction|ActionMessages|DetailMessages|Country|City|StatusCode)>' /tmp/tracking.xml || true
