name: Patch 66 validation

on:
  push:
    branches:
      - patch66-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Patch 66
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt-patches
          git show origin/chatgpt-patches:66.patch > /tmp/66.patch
          test -s /tmp/66.patch

      - name: Recover intended Patch 66 tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount --reject /tmp/66.patch || true
          mapfile -t rejects < <(find . -name '*.rej' -print | sort)
          if [ "${#rejects[@]}" -ne 1 ] || [ "${rejects[0]}" != './src/pages/HomeView.vue.rej' ]; then
            printf 'Unexpected reject set:\n%s\n' "${rejects[*]-}"
            exit 1
          fi
          grep -F 'Отправить бирку' src/pages/HomeView.vue.rej >/dev/null
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/HomeView.vue')
          source = path.read_text(encoding='utf-8')
          needle_lines = [
              '                    </button>',
              '                    </dd>',
              '                    <dd',
              '                      v-if="deliveryWasRedirected(order.delivery)"',
              '                      class="text-xs font-semibold text-violet-700"',
          ]
          insert_lines = [
              '                    </button>',
              '                    </dd>',
              '                    <dd',
              '                      v-if="canSendOrderLabel(order)"',
              '                      class="mt-2 flex flex-col items-center gap-1"',
              '                    >',
              '                      <button',
              '                        class="inline-flex items-center gap-1.5 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-800 hover:bg-emerald-100 disabled:cursor-wait disabled:opacity-50"',
              '                        type="button"',
              '                        :disabled="isSendingLabelEmail"',
              '                        @click="openOrderLabelEmail(order)"',
              '                      >',
              '                        <Mail class="size-4" aria-hidden="true" />',
              '                        {{',
              '                          isSendingLabelEmail && labelEmailOrderId === order.id',
              "                            ? 'Отправляем…'",
              '                            : labelSentForCurrentTtn(order)',
              "                              ? 'Отправить бирку повторно'",
              "                              : 'Отправить бирку'",
              '                        }}',
              '                      </button>',
              '                      <span',
              '                        v-if="labelSentForCurrentTtn(order)"',
              '                        class="text-[11px] font-semibold text-emerald-700"',
              '                      >',
              '                        Бирка отправлена {{ formatLabelEmailSentAt(order.delivery.labelEmailSentAt) }}',
              '                      </span>',
              '                    </dd>',
              '                    <dd',
              '                      v-if="deliveryWasRedirected(order.delivery)"',
              '                      class="text-xs font-semibold text-violet-700"',
          ]
          needle = '\n'.join(needle_lines) + '\n'
          replacement = '\n'.join(insert_lines) + '\n'
          count = source.count(needle)
          if count != 1:
              raise SystemExit(f'HomeView insertion anchor count is {count}, expected 1')
          path.write_text(source.replace(needle, replacement), encoding='utf-8')
          PY
          rm src/pages/HomeView.vue.rej

          git cat-file -e e316dc6442e3459563f9ed3cdc1484e835bea00d^{blob}
          git cat-file blob e316dc6442e3459563f9ed3cdc1484e835bea00d > /tmp/66.complete-old.patch
          awk '/^diff --git a\/src\/pages\/SettingsView.vue b\/src\/pages\/SettingsView.vue$/{copy=1} copy' \
            /tmp/66.complete-old.patch > /tmp/66.new-files.patch
          test -s /tmp/66.new-files.patch
          git apply --recount --check /tmp/66.new-files.patch
          git apply --recount /tmp/66.new-files.patch

          test -f src/pages/SettingsView.vue
          test -f supabase/functions/_shared/order-label.ts
          test -f supabase/functions/_shared/order-label_test.ts
          test -f supabase/functions/send-order-label-email/index.ts

          python - <<'PY'
          from pathlib import Path

          backend = Path('supabase/functions/send-order-label-email/index.ts')
          source = backend.read_text(encoding='utf-8')
          old_pdf = """async function pdfText(bytes: Uint8Array) {
            const pdf = await getDocumentProxy(bytes)
            try {
              if (pdf.numPages > maxPdfPages) throw new Error('Бирка содержит слишком много страниц.')
              const extracted = await Promise.race([
                extractText(pdf, { mergePages: true }),
                new Promise<never>((_, reject) =>
                  setTimeout(() => reject(new Error('Не удалось прочитать PDF за отведённое время.')), 10_000),
                ),
              ])
              return typeof extracted.text === 'string' ? extracted.text : extracted.text.join('\\n')
            } finally {
              await pdf.destroy()
            }
          }
          """
          new_pdf = """async function pdfText(bytes: Uint8Array) {
            const pdf = await getDocumentProxy(bytes)
            if (pdf.numPages > maxPdfPages) throw new Error('Бирка содержит слишком много страниц.')
            const extracted = await Promise.race([
              extractText(pdf, { mergePages: true }),
              new Promise<never>((_, reject) =>
                setTimeout(() => reject(new Error('Не удалось прочитать PDF за отведённое время.')), 10_000),
              ),
            ])
            return extracted.text
          }
          """
          if source.count(old_pdf) != 1:
              raise SystemExit('Expected pdfText implementation not found exactly once')
          source = source.replace(old_pdf, new_pdf)

          ambiguity_anchor = """  if (!labelTtns.length) {
            return Response.json(
              { ok: false, message: 'Не удалось определить ТТН в бирке. Отправка отменена.' },
              { status: 422, headers: corsHeaders },
            )
          }
          if (!labelTtns.includes(orderTtn)) {
          """
          ambiguity_replacement = """  if (!labelTtns.length) {
            return Response.json(
              { ok: false, message: 'Не удалось определить ТТН в бирке. Отправка отменена.' },
              { status: 422, headers: corsHeaders },
            )
          }
          if (labelTtns.length !== 1) {
            return Response.json(
              {
                ok: false,
                message: `В бирке найдено несколько ТТН: ${labelTtns.join(', ')}. Отправка отменена.`,
              },
              { status: 422, headers: corsHeaders },
            )
          }
          if (!labelTtns.includes(orderTtn)) {
          """
          if source.count(ambiguity_anchor) != 1:
              raise SystemExit('TTN ambiguity anchor not found exactly once')
          source = source.replace(ambiguity_anchor, ambiguity_replacement)

          latest_select = """  const { data: latestOrder, error: latestOrderError } = await admin
            .from('crm_orders')
            .select('delivery')
            .eq('id', orderId)
            .maybeSingle()
          """
          latest_select_new = """  const { data: latestOrder, error: latestOrderError } = await admin
            .from('crm_orders')
            .select('delivery, updated_at')
            .eq('id', orderId)
            .maybeSingle()
          """
          if source.count(latest_select) != 1:
              raise SystemExit('Latest order select anchor not found exactly once')
          source = source.replace(latest_select, latest_select_new)

          save_anchor = """  const { error: saveError } = await admin
            .from('crm_orders')
            .update({
              delivery: {
                ...latestDelivery,
                labelEmailSentAt: sentAt,
                labelEmailSentTtn: orderTtn,
                labelEmailMessageId: messageId || undefined,
              },
            })
            .eq('id', orderId)
          if (saveError) {
          """
          save_new = """  const { data: savedOrder, error: saveError } = await admin
            .from('crm_orders')
            .update({
              delivery: {
                ...latestDelivery,
                labelEmailSentAt: sentAt,
                labelEmailSentTtn: orderTtn,
                labelEmailMessageId: messageId || undefined,
              },
            })
            .eq('id', orderId)
            .eq('updated_at', latestOrder.updated_at)
            .select('id')
            .maybeSingle()
          if (saveError || !savedOrder) {
          """
          if source.count(save_anchor) != 1:
              raise SystemExit('Label sent-state save anchor not found exactly once')
          backend.write_text(source.replace(save_anchor, save_new), encoding='utf-8')

          tests = Path('supabase/functions/_shared/order-label_test.ts')
          tests.write_text("""import {
            canonicalOrderLabelTtn,
            orderLabelCarrier,
            orderLabelMailText,
            orderLabelTtns,
          } from './order-label.ts'

          function assert(value: unknown, message: string): asserts value {
            if (!value) throw new Error(message)
          }

          Deno.test('Rozetka label extracts standalone PRM TTN and formats mail text', () => {
            const labelText = `
          Замовлення Prom.ua 426327729
          6742
          М. ХАРКІВ М. КИЇВ
          PRM-251996742
          1/1
          `
            assert(orderLabelCarrier('RozetkaDelivery') === 'rozetka', 'Rozetka carrier must be supported')
            assert(
              JSON.stringify(orderLabelTtns('rozetka', labelText)) === JSON.stringify(['PRM-251996742']),
              'Rozetka label must extract the standalone PRM TTN',
            )
            assert(
              canonicalOrderLabelTtn('rozetka', 'prm251996742') === 'PRM-251996742',
              'Rozetka stored TTN must normalize',
            )
            assert(
              orderLabelMailText('rozetka', 'PRM-251996742') === 'Розетка PRM-251996742',
              'Rozetka mail text must use the required carrier name',
            )
          })

          Deno.test('Meest label ignores technical barcode and supports Epicentr delivery aliases', () => {
            const labelText = `
          1 Рівне
          723-1356399001001HSU М723-1356399001001HSUИО
          С1
          Центр видачі замовлень ЕПІЦЕНТР.ua
          723-1356399
          `
            assert(orderLabelCarrier('Meest') === 'meest', 'Meest carrier must be supported')
            assert(orderLabelCarrier('parcel_box_epicentr') === 'meest', 'Epicentr parcel box must be Meest')
            assert(orderLabelCarrier('cvz_epicentr') === 'meest', 'Epicentr collection point must be Meest')
            assert(
              JSON.stringify(orderLabelTtns('meest', labelText)) === JSON.stringify(['723-1356399']),
              'Meest label must ignore the longer technical barcode',
            )
            assert(
              canonicalOrderLabelTtn('meest', '7231356399') === '723-1356399',
              'Meest stored TTN without hyphen must normalize',
            )
            assert(
              orderLabelMailText('meest', '723-1356399') === 'Мист 723-1356399',
              'Meest mail text must use the required carrier name',
            )
          })

          Deno.test('Multiple standalone TTNs stay distinct so the sender can reject an ambiguous PDF', () => {
            assert(
              JSON.stringify(orderLabelTtns('meest', '723-1356399\\n723-2077836')) ===
                JSON.stringify(['723-1356399', '723-2077836']),
              'Multiple standalone TTNs must not be collapsed into one',
            )
          })

          Deno.test('Unsupported carriers are rejected', () => {
            assert(orderLabelCarrier('Новая почта') === null, 'Unsupported carriers must be rejected')
          })
          """, encoding='utf-8')
          PY

          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print
            exit 1
          fi
          git add -N src/pages/SettingsView.vue \
            supabase/functions/_shared/order-label.ts \
            supabase/functions/_shared/order-label_test.ts \
            supabase/functions/send-order-label-email/index.ts
          git diff --check

      - name: Guard task scope before tooling
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          src/features/orders/types.ts
          src/layouts/MainLayout.vue
          src/pages/HomeView.vue
          src/pages/SettingsView.vue
          src/router/index.ts
          supabase/config.toml
          supabase/functions/_shared/order-label.ts
          supabase/functions/_shared/order-label_test.ts
          supabase/functions/send-order-label-email/index.ts
          supabase/functions/sync-epicentr-orders/index.ts
          supabase/functions/sync-kasta-orders/index.ts
          supabase/functions/sync-prom-orders/index.ts
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/migrations/'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Order label unit tests
        run: deno test supabase/functions/_shared/order-label_test.ts

      - name: Edge Function type check
        run: deno check --node-modules-dir=auto supabase/functions/send-order-label-email/index.ts

      - name: Restore unrelated formatter output
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- src/features/orders/delivery-tracking.ts

      - name: Guard task scope after tooling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-after
          diff -u /tmp/expected-files /tmp/actual-files-after
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/migrations/'

      - name: Generate normalized Patch 66
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary --full-index > /tmp/66.fixed.patch
          test -s /tmp/66.fixed.patch
          git reset --hard HEAD
          git clean -fd
          git apply --check /tmp/66.fixed.patch
          git apply /tmp/66.fixed.patch
          git add -N src/pages/SettingsView.vue \
            supabase/functions/_shared/order-label.ts \
            supabase/functions/_shared/order-label_test.ts \
            supabase/functions/send-order-label-email/index.ts
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-reapplied
          diff -u /tmp/expected-files /tmp/actual-files-reapplied
          pnpm type-check
          pnpm build
          deno test supabase/functions/_shared/order-label_test.ts
          deno check --node-modules-dir=auto supabase/functions/send-order-label-email/index.ts

      - uses: actions/upload-artifact@v4
        with:
          name: patch66-normalized
          path: /tmp/66.fixed.patch
          if-no-files-found: error
