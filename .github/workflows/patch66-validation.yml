name: Patch 66 validation

on:
  push:
    branches:
      - patch66-validation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Patch 66
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt-patches
          git show origin/chatgpt-patches:66.patch > /tmp/66.patch
          test -s /tmp/66.patch

      - name: Recover intended Patch 66 tree
        shell: bash
        run: |
          set -euo pipefail
          # The first published file was hand-authored with bad hunk metadata and
          # one stale HomeView context. Reconstruct its intended tree once here;
          # the normalized artifact produced later must pass ordinary git apply.
          git apply --recount --reject /tmp/66.patch || true
          mapfile -t rejects < <(find . -name '*.rej' -print | sort)
          if [ "${#rejects[@]}" -ne 1 ] || [ "${rejects[0]}" != './src/pages/HomeView.vue.rej' ]; then
            printf 'Unexpected reject set:\n%s\n' "${rejects[*]-}"
            exit 1
          fi
          grep -F 'Отправить бирку' src/pages/HomeView.vue.rej >/dev/null
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/HomeView.vue')
          source = path.read_text(encoding='utf-8')
          needle = '''                    </button>
                    </dd>
                    <dd
                      v-if="deliveryWasRedirected(order.delivery)"
                      class="text-xs font-semibold text-violet-700"
'''
          replacement = '''                    </button>
                    </dd>
                    <dd
                      v-if="canSendOrderLabel(order)"
                      class="mt-2 flex flex-col items-center gap-1"
                    >
                      <button
                        class="inline-flex items-center gap-1.5 rounded-lg border border-emerald-200 bg-emerald-50 px-3 py-1.5 text-xs font-semibold text-emerald-800 hover:bg-emerald-100 disabled:cursor-wait disabled:opacity-50"
                        type="button"
                        :disabled="isSendingLabelEmail"
                        @click="openOrderLabelEmail(order)"
                      >
                        <Mail class="size-4" aria-hidden="true" />
                        {{
                          isSendingLabelEmail && labelEmailOrderId === order.id
                            ? 'Отправляем…'
                            : labelSentForCurrentTtn(order)
                              ? 'Отправить бирку повторно'
                              : 'Отправить бирку'
                        }}
                      </button>
                      <span
                        v-if="labelSentForCurrentTtn(order)"
                        class="text-[11px] font-semibold text-emerald-700"
                      >
                        Бирка отправлена {{ formatLabelEmailSentAt(order.delivery.labelEmailSentAt) }}
                      </span>
                    </dd>
                    <dd
                      v-if="deliveryWasRedirected(order.delivery)"
                      class="text-xs font-semibold text-violet-700"
'''
          count = source.count(needle)
          if count != 1:
              raise SystemExit(f'HomeView insertion anchor count is {count}, expected 1')
          path.write_text(source.replace(needle, replacement), encoding='utf-8')
          PY
          rm src/pages/HomeView.vue.rej
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print
            exit 1
          fi
          git diff --check

      - name: Guard task scope before tooling
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files <<'EOF'
          src/features/orders/types.ts
          src/layouts/MainLayout.vue
          src/pages/HomeView.vue
          src/pages/SettingsView.vue
          src/router/index.ts
          supabase/config.toml
          supabase/functions/_shared/order-label.ts
          supabase/functions/_shared/order-label_test.ts
          supabase/functions/send-order-label-email/index.ts
          supabase/functions/sync-epicentr-orders/index.ts
          supabase/functions/sync-kasta-orders/index.ts
          supabase/functions/sync-prom-orders/index.ts
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/migrations/'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Order label unit tests
        run: deno test supabase/functions/_shared/order-label_test.ts

      - name: Edge Function type check
        run: deno check supabase/functions/send-order-label-email/index.ts

      - name: Guard task scope after tooling
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-after
          diff -u /tmp/expected-files /tmp/actual-files-after
          ! git diff --name-only | grep -Fx 'AGENTS.md'
          ! git diff --name-only | grep -E '^supabase/migrations/'

      - name: Generate normalized Patch 66
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary --full-index > /tmp/66.fixed.patch
          test -s /tmp/66.fixed.patch
          git reset --hard HEAD
          git clean -fd
          # Acceptance criterion for the file handed to Codex: no --recount.
          git apply --check /tmp/66.fixed.patch
          git apply /tmp/66.fixed.patch
          git diff --check
          git diff --name-only | sort > /tmp/actual-files-reapplied
          diff -u /tmp/expected-files /tmp/actual-files-reapplied
          pnpm type-check
          pnpm build

      - uses: actions/upload-artifact@v4
        with:
          name: patch66-normalized
          path: /tmp/66.fixed.patch
          if-no-files-found: error
