name: Publish Verified Patch 69

on:
  push:
    branches: [chatgpt-validation-69]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 479ff9f6ffe3f71ea61ce1fe1a257f2f333b5b79
      EXPECTED_PATCH_SHA: e17b7707517cd113c6196d50de8ebe1584d5ccebbed120ea49d107c734111c79
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate exact already-built Patch 69
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-patches
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: replacement anchor mismatch")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "android/app/build.gradle.kts",
              '        versionCode = 6\n        versionName = "0.6"',
              '        versionCode = 7\n        versionName = "0.7"',
          )
          replace_once(
              "android/app/src/main/java/ua/orders/crm/OrderNotification.kt",
              "import android.os.Build\n",
              "import android.os.Build\nimport java.math.RoundingMode\n",
          )
          replace_once(
              "android/app/src/main/java/ua/orders/crm/OrderNotification.kt",
              '''    val notification = Notification.Builder(this, NEW_ORDERS_CHANNEL_ID)\n        .setSmallIcon(R.drawable.ic_orders)\n        .setContentTitle("Новый заказ · ${order.platform.display()}")\n        .setContentText("№${order.number()} · ${order.customer.display()}")\n''',
              '''    val total = order.total().setScale(2, RoundingMode.HALF_UP).toPlainString() + " грн"\n    val notification = Notification.Builder(this, NEW_ORDERS_CHANNEL_ID)\n        .setSmallIcon(R.drawable.ic_orders)\n        .setContentTitle("Новый заказ · ${order.platform.display()} · $total")\n        .setContentText("${order.customer.display()} · №${order.number()}")\n''',
          )
          main = "android/app/src/main/java/ua/orders/crm/MainActivity.kt"
          replace_once(
              main,
              "            color = Color(0xFFF5D0FE),\n            contentColor = Color(0xFF86198F),\n            border = BorderStroke(1.dp, Color(0xFFE879F9)),",
              "            color = Color(0xFFE879F9),\n            contentColor = Color(0xFF4A044E),\n            border = BorderStroke(1.dp, Color(0xFFC026D3)),",
          )
          replace_once(
              main,
              "        StatusTone.BLUE -> StatusColors(Color(0xFFDBEAFE), Color(0xFF1E40AF))\n        StatusTone.GREEN -> StatusColors(Color(0xFFDCFCE7), Color(0xFF166534))\n        StatusTone.ORANGE -> StatusColors(Color(0xFFFFEDD5), Color(0xFF9A3412))\n        StatusTone.RED -> StatusColors(Color(0xFFFEE2E2), Color(0xFF991B1B))",
              "        StatusTone.BLUE -> StatusColors(Color(0xFFBFDBFE), Color(0xFF1E3A8A))\n        StatusTone.GREEN -> StatusColors(Color(0xFFBBF7D0), Color(0xFF14532D))\n        StatusTone.ORANGE -> StatusColors(Color(0xFFFED7AA), Color(0xFF7C2D12))\n        StatusTone.RED -> StatusColors(Color(0xFFFECACA), Color(0xFF7F1D1D))",
          )
          replace_once(
              main,
              '''                            OutlinedButton(\n                                onClick = { openViber(context, phone.orEmpty()) },\n                                modifier = Modifier.weight(1f).height(46.dp),\n                            ) { Text("Viber") }\n                            OutlinedButton(\n                                onClick = { openTelegram(context, phone.orEmpty()) },\n                                modifier = Modifier.weight(1f).height(46.dp),\n                            ) { Text("Telegram") }\n''',
              '''                            Button(\n                                onClick = { openViber(context, phone.orEmpty()) },\n                                modifier = Modifier.weight(1f).height(46.dp),\n                                colors = ButtonDefaults.buttonColors(\n                                    containerColor = Color(0xFF7360F2),\n                                    contentColor = Color.White,\n                                ),\n                            ) { Text("Viber", fontWeight = FontWeight.SemiBold) }\n                            Button(\n                                onClick = { openTelegram(context, phone.orEmpty()) },\n                                modifier = Modifier.weight(1f).height(46.dp),\n                                colors = ButtonDefaults.buttonColors(\n                                    containerColor = Color(0xFF229ED9),\n                                    contentColor = Color.White,\n                                ),\n                            ) { Text("Telegram", fontWeight = FontWeight.SemiBold) }\n''',
          )
          PY

          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' android/app/build.gradle.kts android/app/src/main/java/ua/orders/crm/MainActivity.kt android/app/src/main/java/ua/orders/crm/OrderNotification.kt | sort)"
          git diff --binary -- android/app/build.gradle.kts android/app/src/main/java/ua/orders/crm/MainActivity.kt android/app/src/main/java/ua/orders/crm/OrderNotification.kt > /tmp/69.patch
          test "$(sha256sum /tmp/69.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA"

          git reset --hard "$BASE_SHA"
          git clean -fd
          git apply --check --verbose /tmp/69.patch
          git apply /tmp/69.patch
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' android/app/build.gradle.kts android/app/src/main/java/ua/orders/crm/MainActivity.kt android/app/src/main/java/ua/orders/crm/OrderNotification.kt | sort)"

      - name: Prepare instruction
        run: |
          set -euo pipefail
          cat > /tmp/69.txt <<EOF
          Patch 69 — Android 0.7: сумма в уведомлении и более контрастные элементы заказа

          ВАЖНО
          - Источник истины: main $BASE_SHA.
          - Patch 68 уже применён в main до Patch 67; Patch 69 подготовлен против актуального состояния после них.
          - Не изменять AGENTS.md, Web CRM, Supabase, migrations/functions и GitHub workflow.
          - Не перенастраивать JDK/Android SDK/Gradle/signing и не создавать новый keystore.
          - applicationId остаётся ua.orders.crm.
          - Android: versionCode 7, versionName 0.7.
          - Если любая проверка не проходит — остановиться и сообщить точную ошибку; самостоятельно Patch 69 не чинить.

          Что меняет Patch 69
          - Уведомление: первая строка «Новый заказ · <площадка> · <сумма> грн»; вторая «<имя покупателя> · №<номер заказа>».
          - Сумма берётся из существующего order.total(); новой бизнес-формулы нет.
          - Плашка НОВЫЙ ЗАКАЗ получает более насыщенный фон; остальные статусные плашки тоже становятся контрастнее.
          - Viber: залитая кнопка #7360F2 с белым текстом.
          - Telegram: залитая кнопка #229ED9 с белым текстом.
          - Deep links, Realtime, cache/incremental sync, notification dedupe, acceptance и бизнес-статусы не меняются.

          Ровно 3 файла
          - android/app/build.gradle.kts
          - android/app/src/main/java/ua/orders/crm/MainActivity.kt
          - android/app/src/main/java/ua/orders/crm/OrderNotification.kt

          Применение
          1. В C:\Users\Вадим\Documents\CRM моя\specmarket выполнить: git fetch origin main chatgpt-patches
          2. Убедиться, что origin/main = $BASE_SHA. Если main уже другой — остановиться и сообщить новый SHA до применения.
          3. Работать в отдельном чистом worktree C:\Users\Вадим\Documents\CRM моя\specmarket-p69 от origin/main.
          4. Получить patch без изменения байтов:
             cmd /c "git show origin/chatgpt-patches:69.patch > 69.apply.patch"
          5. Проверить SHA-256:
             (Get-FileHash -Algorithm SHA256 69.apply.patch).Hash.ToLower()
             Ожидаемый SHA-256: $EXPECTED_PATCH_SHA
          6. Выполнить:
             git apply --check 69.apply.patch
             git apply 69.apply.patch
             Remove-Item 69.apply.patch

          Обязательные проверки
          - git diff --check
          - git status --short и git diff --name-only: только 3 файла Patch 69; AGENTS.md не включать.
          - testDebugUnitTest
          - lintDebug
          - assembleDebug
          - assembleRelease
          - apksigner verify --print-certs
          - signer SHA-256: a636240c4b6a13606c15156cb0e74e0969a99236eb5715c0b3455c4eb1bc9c53
          - после проверок снова git diff --check и ровно 3 файла.

          Контрольные случаи
          - В свёрнутом уведомлении площадка и сумма стоят в первой строке; имя и номер — во второй.
          - Плашки заметно контрастнее поверхности карточки.
          - Viber/Telegram имеют заданные заливки и белый текст.
          - Нажатия Viber/Telegram используют прежние deep links и безопасный fallback.
          - Логика Patch 67 не изменена.

          Commit / push
          - В commit только 3 файла Patch 69.
          - Commit message: Improve Android order notification and actions
          - Перед commit/push снова git fetch origin main; если origin/main изменился относительно $BASE_SHA — остановиться.
          - git push origin HEAD:main
          - Никаких Supabase deploy/db push.

          После push
          - Дождаться success Android APK workflow.
          - Убедиться, что artifact orders-android-release создан.
          - Сообщить commit SHA, run ID, signer SHA-256 и artifact name.
          EOF
          if grep -nE '[[:blank:]]+$' /tmp/69.txt; then exit 1; fi

      - name: Publish files
        run: |
          set -euo pipefail
          git fetch origin main chatgpt-patches
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git reset --hard "$BASE_SHA"
          git clean -fd
          git checkout -B publish origin/chatgpt-patches
          cp /tmp/69.patch 69.patch
          cp /tmp/69.txt 69.txt
          git add 69.patch 69.txt
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 69.patch 69.txt | sort)"
          git config user.name 'ChatGPT Patch Validator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Publish Patch 69'
          git push origin HEAD:chatgpt-patches
