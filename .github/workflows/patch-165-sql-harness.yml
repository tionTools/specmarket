name: Patch 165 SQL harness

on:
  push:
    branches:
      - codex/patch-165-sql-harness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start isolated PostgreSQL
        run: docker run --detach --name patch165-postgres --env POSTGRES_PASSWORD=postgres postgres:17

      - name: Run Patch 165 SQL harness
        run: |
          until docker exec patch165-postgres pg_isready -U postgres; do sleep 1; done
          docker exec -i patch165-postgres psql -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/patch-165-accounting-history-seal-harness.sql

      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm --force patch165-postgres
