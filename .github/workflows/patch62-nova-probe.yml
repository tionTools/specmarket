name: Patch 62 Nova Probe

on:
  push:
    branches: [chatgpt-validate-62]
    paths:
      - '.github/workflows/patch62-nova-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Probe original and CargoReturn documents
        shell: bash
        run: |
          cat >/tmp/request.json <<'EOF'
          {"apiKey":"","modelName":"TrackingDocument","calledMethod":"getStatusDocuments","methodProperties":{"Documents":[{"DocumentNumber":"20451528497280"},{"DocumentNumber":"59001764954977"}]}}
          EOF
          curl -fsS --max-time 20 -H 'Content-Type: application/json' \
            -d @/tmp/request.json https://api.novaposhta.ua/v2.0/json/ > /tmp/live.json
          python - <<'PY' | tee /tmp/live-summary.txt
          import json
          p=json.load(open('/tmp/live.json'))
          for row in p.get('data', []):
              keys=['Number','Status','StatusCode','DateScan','TrackingUpdateDate','CitySender','WarehouseSender','CityRecipient','WarehouseRecipient','ScheduledDeliveryDate','ActualDeliveryDate','LastCreatedOnTheBasisDocumentType','LastCreatedOnTheBasisNumber','DateReturnCargo']
              print(json.dumps({k:row.get(k) for k in keys}, ensure_ascii=False, indent=2))
          print('errors=', p.get('errors'))
          print('warnings=', p.get('warnings'))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: patch62-nova-live-return
          path: /tmp/live-summary.txt
          if-no-files-found: error
