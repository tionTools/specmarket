name: Deploy NovaPay Edge Functions
# Temporary one-shot production deploy.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-novapay-edge-temp.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: rtkhgldaswsclkorlyxx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify Supabase access token
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Deploy novapay-data
        run: pnpm exec supabase functions deploy novapay-data --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy novapay-balance
        run: pnpm exec supabase functions deploy novapay-balance --project-ref "$SUPABASE_PROJECT_REF"
