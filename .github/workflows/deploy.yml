name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A second push must wait rather than delete a deployment in progress.
concurrency:
  group: specmarket-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js 25
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: 📦 Build project
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          export VITE_BUILD_SHA="$GITHUB_SHA"
          export VITE_BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # pnpm lint
          # pnpm prettier
          # pnpm test
          pnpm build

      - name: 🏷️ Prepare deployment names
        id: meta
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PROJECT_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "dist_name=dist-$PROJECT_NAME-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "project_path=~/tion.tools/$PROJECT_NAME" >> "$GITHUB_OUTPUT"

      - name: 📦 Create deployment archive ${{ steps.meta.outputs.dist_name }}
        run: |
          tar -czf ${{ steps.meta.outputs.dist_name }} -C dist .
          ls -lh ${{ steps.meta.outputs.dist_name }}

      - name: 📂 Upload build and configs to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          source: ${{ steps.meta.outputs.dist_name }}
          target: '~/'

      - name: 🚀 Deploy ${{ steps.meta.outputs.project_name }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -eu
            PROJECT="$HOME/tion.tools/${{ steps.meta.outputs.project_name }}"
            ARCHIVE=~/${{ steps.meta.outputs.dist_name }}
            TEMP="${PROJECT}-temp-${{ github.run_id }}-${{ github.run_attempt }}"
            BACKUP="${PROJECT}-backup"

            # Never remove the live site until the archive extracts successfully.
            rm -rf "$TEMP"
            mkdir -p "$TEMP"
            tar -xzf "$ARCHIVE" -C "$TEMP"
            test -s "$TEMP/index.html"
            test -d "$TEMP/assets"

            rm -rf "$BACKUP"
            if [ -d "$PROJECT" ]; then mv "$PROJECT" "$BACKUP"; fi
            if ! mv "$TEMP" "$PROJECT"; then
              if [ -d "$BACKUP" ]; then mv "$BACKUP" "$PROJECT"; fi
              exit 1
            fi
            rm -rf "$BACKUP"
            rm -f "$ARCHIVE"

            echo "✅ Deployment completed! ${{ steps.meta.outputs.repo_name }}"
            ls -la "$PROJECT"
            test -s "$PROJECT/index.html"
