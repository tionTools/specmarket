name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'supabase/functions/sync-prom-orders/**'
      - 'supabase/functions/_shared/prom-order-action*'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare release signing
        env:
          ORDERS_RELEASE_STORE_B64: ${{ secrets.ORDERS_RELEASE_STORE_B64 }}
          ORDERS_RELEASE_STORE_PASS: ${{ secrets.ORDERS_RELEASE_STORE_PASS }}
          ORDERS_RELEASE_ALIAS: ${{ secrets.ORDERS_RELEASE_ALIAS }}
          ORDERS_RELEASE_KEY_PASS: ${{ secrets.ORDERS_RELEASE_KEY_PASS }}
        run: |
          test -n "$ORDERS_RELEASE_STORE_B64"
          test -n "$ORDERS_RELEASE_STORE_PASS"
          test -n "$ORDERS_RELEASE_ALIAS"
          test -n "$ORDERS_RELEASE_KEY_PASS"
          printf '%s' "$ORDERS_RELEASE_STORE_B64" | base64 --decode > "$RUNNER_TEMP/orders-release.jks"
          echo "ORDERS_RELEASE_STORE_FILE=$RUNNER_TEMP/orders-release.jks" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_STORE_PASS=$ORDERS_RELEASE_STORE_PASS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_ALIAS=$ORDERS_RELEASE_ALIAS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_KEY_PASS=$ORDERS_RELEASE_KEY_PASS" >> "$GITHUB_ENV"
      - run: ./gradlew testDebugUnitTest lintDebug assembleRelease
        working-directory: android
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orders-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish stable latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          tag="android-latest"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' android/app/build.gradle.kts | head -n 1)"
          version="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$version_code"
          updated="$(date -u '+%Y-%m-%d %H:%M UTC')"
          title="Android APK готова — v${version}"
          previous="$(gh release view "$tag" --json body --jq .body 2>/dev/null || true)"
          previous_code="$(printf '%s\n' "$previous" | sed -n 's/^.*VersionCode: \([0-9][0-9]*\).*$/\1/p' | head -n 1)"
          if [ -z "$previous_code" ]; then previous_code="$(printf '%s\n' "$previous" | sed -n 's/^.*Версия: 0\.\([0-9][0-9]*\).*$/\1/p' | head -n 1)"; fi
          previous_sha="$(printf '%s\n' "$previous" | sed -n 's/^.*Commit: \([0-9a-f]*\).*$/\1/p' | head -n 1)"
          if [ -n "$previous_code" ] && [ "$version_code" -le "$previous_code" ] && [ "$previous_sha" != "$GITHUB_SHA" ]; then echo "Refusing to publish versionCode $version_code after $previous_code from a different commit." >&2; exit 1; fi
          notes="Последняя успешная Android-сборка. VersionCode: ${version_code}. VersionName: ${version}. Обновлено: ${updated}. Commit: ${GITHUB_SHA}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk#app-release.apk" --clobber
            gh release edit "$tag" \
              --title "$title" \
              --notes "$notes"
          else
            gh release create "$tag" "$apk#app-release.apk" \
              --title "$title" \
              --notes "$notes" \
              --latest=false
          fi
