name: Patch 185 temporary Deno test
on:
  push:
    branches:
      - fix/patch-183-nova-arrival-date
    paths:
      - 'supabase/functions/sync-delivery-tracking/**'
      - '.github/workflows/patch-185-temporary-deno-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno regression tests for pickup deadline
        run: deno test supabase/functions/sync-delivery-tracking/pickup-reminders_test.ts
      - name: Check reminder parser
        run: deno check supabase/functions/sync-delivery-tracking/pickup-reminders.ts
