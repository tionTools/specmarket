name: Banking Broadcast reconnect

on:
  pull_request:
    paths:
      - 'src/features/banking/useBankingMonitor.ts'
      - 'src/features/banking/BankBalancesCard.vue'
      - 'src/features/banking/banking-broadcast-reconnect_test.mjs'
      - 'src/pages/HomeView.vue'
      - '.github/workflows/banking-broadcast-reconnect.yml'

jobs:
  banking-realtime-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Reproduce two-browser Broadcast loss and catch-up
        run: node src/features/banking/banking-broadcast-reconnect_test.mjs
