name: NovaPay authentication timeout regression

on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/novapay-soap-timeout.ts'
      - 'supabase/functions/_shared/novapay-soap-timeout_test.ts'
      - 'supabase/functions/_shared/novapay-auth.ts'
      - 'supabase/functions/_shared/novapay-auth_test.ts'
      - '.github/workflows/novapay-auth-timeout.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check timeout module
        run: deno check supabase/functions/_shared/novapay-soap-timeout.ts
      - name: Test timeout and auth guard
        run: deno test supabase/functions/_shared/novapay-soap-timeout_test.ts supabase/functions/_shared/novapay-auth_test.ts
