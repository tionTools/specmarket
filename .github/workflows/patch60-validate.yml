name: Patch 60 Validation

on:
  push:
    branches: [chatgpt-validate-60]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply candidate
        run: |
          git apply --check --recount PATCH60-CANDIDATE.patch
          git apply --recount PATCH60-CANDIDATE.patch

      - name: Validate scope and whitespace
        shell: bash
        run: |
          BASE=f8d2e3f08b9047b94143033df11f6827db4bebb1
          git diff --check "$BASE" -- \
            src/features/orders/delivery-tracking.ts \
            src/features/orders/types.ts \
            src/pages/HomeView.vue \
            supabase/functions/sync-delivery-tracking/storage.ts \
            supabase/functions/sync-delivery-tracking/storage_return_test.ts
          git diff --name-only "$BASE" -- \
            src/features/orders/delivery-tracking.ts \
            src/features/orders/types.ts \
            src/pages/HomeView.vue \
            supabase/functions/sync-delivery-tracking/storage.ts \
            supabase/functions/sync-delivery-tracking/storage_return_test.ts | sort > /tmp/changed.txt
          cat > /tmp/expected.txt <<'EOF'
          src/features/orders/delivery-tracking.ts
          src/features/orders/types.ts
          src/pages/HomeView.vue
          supabase/functions/sync-delivery-tracking/storage.ts
          supabase/functions/sync-delivery-tracking/storage_return_test.ts
          EOF
          diff -u /tmp/expected.txt /tmp/changed.txt
          ! grep -Fx 'AGENTS.md' /tmp/changed.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Frontend return status regression
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import {
            currentReturnTrackingStatus,
            deliveryReturnStatus,
            expectedReturnLabel,
            returnDestinationLabel,
          } from './src/features/orders/delivery-tracking.ts'

          assert.equal(
            deliveryReturnStatus('Прибула в депо 4', 'in_transit', true),
            'Возвращается отправителю',
          )
          assert.equal(
            currentReturnTrackingStatus('Прибула в депо 4', 'in_transit', true),
            'Текущий статус: Прибула в депо 4',
          )
          assert.equal(
            currentReturnTrackingStatus('Відмова від отримання', 'returning', true),
            '',
          )
          assert.equal(
            currentReturnTrackingStatus('Отменено', 'in_transit', true),
            '',
          )
          assert.equal(
            returnDestinationLabel('Прибула в депо 4', 'in_transit', 'Циркуни', 'Відділення №1', true, true),
            'Возврат: Циркуни, Відділення №1',
          )
          assert.equal(
            expectedReturnLabel('Прибула в депо 4', 'in_transit', '08-09-2026 15:00:00', true),
            'Ожидается возврат: 08.09, 15:00',
          )
          assert.equal(deliveryReturnStatus('Прибула в депо 4', 'in_transit', false), '')
          console.log('PATCH60_FRONTEND_RUNTIME_OK')
          NODE

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Delivery return regression tests
        run: |
          deno test --allow-env \
            supabase/functions/sync-delivery-tracking/storage_return_test.ts \
            supabase/functions/sync-delivery-tracking/normalize_test.ts \
            supabase/functions/sync-delivery-tracking/carriers/nova-return_test.ts \
            supabase/functions/sync-delivery-tracking/carriers/nova-poshta_test.ts
          deno check supabase/functions/sync-delivery-tracking/index.ts

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Web checks
        run: |
          pnpm install --frozen-lockfile
          pnpm type-check
          pnpm lint
          pnpm build

      - name: Static assertions
        shell: bash
        run: |
          grep -F "trackingReturnInProgress?: boolean" src/features/orders/types.ts
          grep -F "Текущий статус:" src/features/orders/delivery-tracking.ts
          grep -F "currentReturnTrackingStatus(" src/pages/HomeView.vue
          grep -F "nextDelivery.trackingReturnInProgress = returnInProgress" supabase/functions/sync-delivery-tracking/storage.ts
          ! grep -F "AGENTS.md" /tmp/changed.txt

      - name: Build and re-apply canonical Patch 60 from clean main
        shell: bash
        run: |
          BASE=f8d2e3f08b9047b94143033df11f6827db4bebb1
          git diff "$BASE" -- \
            src/features/orders/delivery-tracking.ts \
            src/features/orders/types.ts \
            src/pages/HomeView.vue \
            supabase/functions/sync-delivery-tracking/storage.ts \
            supabase/functions/sync-delivery-tracking/storage_return_test.ts \
            > /tmp/PATCH60-CANONICAL.patch
          test -s /tmp/PATCH60-CANONICAL.patch
          git worktree add /tmp/patch60-base "$BASE"
          cd /tmp/patch60-base
          git apply --check /tmp/PATCH60-CANONICAL.patch
          git apply /tmp/PATCH60-CANONICAL.patch
          git add -N supabase/functions/sync-delivery-tracking/storage_return_test.ts
          git diff --check
          git diff --name-only | sort > /tmp/reapplied.txt
          diff -u /tmp/expected.txt /tmp/reapplied.txt
          cp /tmp/PATCH60-CANONICAL.patch "$GITHUB_WORKSPACE/PATCH60-CANONICAL.patch"

      - uses: actions/upload-artifact@v4
        with:
          name: patch60-canonical
          path: PATCH60-CANONICAL.patch
          if-no-files-found: error
