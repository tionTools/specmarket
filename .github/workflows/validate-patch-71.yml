name: Validate Patch 71
on:
  push:
    branches: [chatgpt-validation-71]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Android 0.8 changes
        run: python .github/prepare-patch-71.py
      - name: Verify exact scope and whitespace
        run: |
          set -euo pipefail
          git diff --check
          printf '%s\n' \
            android/app/build.gradle.kts \
            android/app/src/main/AndroidManifest.xml \
            android/app/src/main/java/ua/orders/crm/Appearance.kt \
            android/app/src/main/java/ua/orders/crm/MainActivity.kt \
            android/app/src/main/java/ua/orders/crm/OrderModels.kt \
            android/app/src/main/java/ua/orders/crm/OrdersCache.kt \
            android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt \
            android/app/src/main/res/drawable/ic_orders.xml \
            android/app/src/test/java/ua/orders/crm/OrderSyncTest.kt | sort > /tmp/expected
          git diff --name-only | sort > /tmp/actual
          diff -u /tmp/expected /tmp/actual
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare release signing
        env:
          ORDERS_RELEASE_STORE_B64: ${{ secrets.ORDERS_RELEASE_STORE_B64 }}
          ORDERS_RELEASE_STORE_PASS: ${{ secrets.ORDERS_RELEASE_STORE_PASS }}
          ORDERS_RELEASE_ALIAS: ${{ secrets.ORDERS_RELEASE_ALIAS }}
          ORDERS_RELEASE_KEY_PASS: ${{ secrets.ORDERS_RELEASE_KEY_PASS }}
        run: |
          set -euo pipefail
          test -n "$ORDERS_RELEASE_STORE_B64"
          test -n "$ORDERS_RELEASE_STORE_PASS"
          test -n "$ORDERS_RELEASE_ALIAS"
          test -n "$ORDERS_RELEASE_KEY_PASS"
          printf '%s' "$ORDERS_RELEASE_STORE_B64" | base64 --decode > "$RUNNER_TEMP/orders-release.jks"
          echo "ORDERS_RELEASE_STORE_FILE=$RUNNER_TEMP/orders-release.jks" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_STORE_PASS=$ORDERS_RELEASE_STORE_PASS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_ALIAS=$ORDERS_RELEASE_ALIAS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_KEY_PASS=$ORDERS_RELEASE_KEY_PASS" >> "$GITHUB_ENV"
      - name: Android full gate
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify permanent signer
        run: |
          set -euo pipefail
          out=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | tr '[:upper:]' '[:lower:]' | grep -F 'a636240c4b6a13606c15156cb0e74e0969a99236eb5715c0b3455c4eb1bc9c53'
      - name: Commit validated source only
        run: |
          set -euo pipefail
          rm .github/prepare-patch-71.py .github/workflows/validate-patch-71.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Prepare Android 0.8 mobile redesign'
          git push origin HEAD:chatgpt-validation-71
