name: Patch 183 server validation (no deploy)
on:
  push:
    branches:
      - chatgpt-patches
    paths:
      - '183.patch'
      - '.github/workflows/validate-backend-183.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: validation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ef1b7741ca825f472a5f4e3928afbb5dbd44e6e
          path: source
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-patches
          path: patches
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate patch and backend tests (no database modifications)
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cd source
            git apply --check ../patches/183.patch
            git apply ../patches/183.patch
            git diff --check
            deno test -A supabase/functions/sync-delivery-tracking/pickup-reminders_test.ts
            deno check supabase/functions/sync-delivery-tracking/pickup-reminders.ts
            deno check supabase/functions/sync-delivery-tracking/worker.ts
          } 2>&1 | tee "$RUNNER_TEMP/183-backend.log"
      - name: SQL migration and RPC smoke in disposable PostgreSQL
        id: sql
        continue-on-error: true
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/183-sql-setup.sql" <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          create schema auth;
          create function auth.uid() returns uuid language sql stable as
            $$select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid$$;
          create function auth.jwt() returns jsonb language sql stable as
            $$select coalesce(nullif(current_setting('request.jwt.claims',true),''),'{}')::jsonb$$;
          create table public.crm_orders (id uuid primary key, status text, delivery jsonb not null default '{}'::jsonb);
          insert into public.crm_orders (id, status, delivery)
          values ('11111111-1111-4111-8111-111111111111', 'В дороге',
                  '{"ttn":"20450000000000","trackingNormalizedStatus":"ready_for_pickup"}');
          SQL
          {
            psql -h localhost -U postgres -d validation -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/183-sql-setup.sql"
            psql -h localhost -U postgres -d validation -v ON_ERROR_STOP=1 -f source/supabase/migrations/20261017190000_crm_pickup_reminders.sql
            psql -h localhost -U postgres -d validation -v ON_ERROR_STOP=1 <<'SQL'
          set request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
          set request.jwt.claims='{"email":"operator@example.com"}';
          set role authenticated;
          select public.crm_set_pickup_reminder_deadline('11111111-1111-4111-8111-111111111111',
              '20450000000000', ((now() at time zone 'Europe/Kyiv')::date + 2));
          select public.crm_confirm_pickup_reminder('11111111-1111-4111-8111-111111111111',
              '20450000000000', ((now() at time zone 'Europe/Kyiv')::date + 2), 'first','telegram');
          reset role;
          do $$
          declare value text;
          begin
            select first_channel into value from public.crm_pickup_reminders
              where order_id='11111111-1111-4111-8111-111111111111';
            if value <> 'telegram' then raise exception 'confirmation was not saved'; end if;
          end
          $$;
          select public.crm_sync_pickup_reminder_auto('11111111-1111-4111-8111-111111111111',
             '20450000000000', ((now() at time zone 'Europe/Kyiv')::date + 1), 'nova');
          do $$
          declare actual date;
          begin
            select deadline into actual from public.crm_pickup_reminders
              where order_id='11111111-1111-4111-8111-111111111111';
            if actual <> ((now() at time zone 'Europe/Kyiv')::date + 2)
              then raise exception 'manual override was overwritten'; end if;
          end
          $$;
          SQL
          } 2>&1 | tee "$RUNNER_TEMP/183-sql.log"
      - name: Commit read-only verification report
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.check.outcome }}
        shell: bash
        run: |
          cd patches
          mkdir -p validation
          {
            printf 'Patch 183 backend validation\n'
            printf 'base: 2ef1b7741ca825f472a5f4e3928afbb5dbd44e6e\n'
            printf 'patch source commit: %s\n' "$GITHUB_SHA"
            printf 'run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf 'outcome: %s\n' "$VALIDATION_OUTCOME"
            printf 'log tail:\n'
            tail -n 140 "$RUNNER_TEMP/183-backend.log" 2>/dev/null || true
          } > validation/183-backend.txt
          printf '\\nSQL migration smoke outcome: %s\\n' "${{ steps.sql.outcome }}" >> validation/183-backend.txt
          tail -n 90 "$RUNNER_TEMP/183-sql.log" >> validation/183-backend.txt 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/183-backend.txt
          git commit -m "Record server Patch 183 validation [skip ci]" || true
          git push origin HEAD:chatgpt-patches
      - name: Fail if validation failed
        if: steps.check.outcome != 'success' || steps.sql.outcome != 'success'
        run: exit 1
