name: Validate Patch 67
on:
  push:
    branches: [chatgpt-validation-67-apply]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply published Patch 67 to validated main
        run: |
          git fetch origin main chatgpt-patches
          git checkout --detach origin/main
          git show origin/chatgpt-patches:67.patch > /tmp/67.patch
          git apply --check /tmp/67.patch
          git apply /tmp/67.patch
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            android/app/build.gradle.kts \
            android/app/src/main/java/ua/orders/crm/Appearance.kt \
            android/app/src/main/java/ua/orders/crm/MainActivity.kt \
            android/app/src/main/java/ua/orders/crm/OrderSync.kt \
            android/app/src/main/java/ua/orders/crm/OrdersCache.kt \
            android/app/src/main/java/ua/orders/crm/OrdersRepository.kt \
            android/app/src/main/java/ua/orders/crm/OrdersViewModel.kt \
            android/app/src/test/java/ua/orders/crm/OrderSyncTest.kt | sort)"
          test "$actual" = "$expected"
          grep -q 'versionCode = 6' android/app/build.gradle.kts
          grep -q 'versionName = "0.6"' android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Prepare existing release signing
        env:
          ORDERS_RELEASE_STORE_B64: ${{ secrets.ORDERS_RELEASE_STORE_B64 }}
          ORDERS_RELEASE_STORE_PASS: ${{ secrets.ORDERS_RELEASE_STORE_PASS }}
          ORDERS_RELEASE_ALIAS: ${{ secrets.ORDERS_RELEASE_ALIAS }}
          ORDERS_RELEASE_KEY_PASS: ${{ secrets.ORDERS_RELEASE_KEY_PASS }}
        run: |
          test -n "$ORDERS_RELEASE_STORE_B64"
          test -n "$ORDERS_RELEASE_STORE_PASS"
          test -n "$ORDERS_RELEASE_ALIAS"
          test -n "$ORDERS_RELEASE_KEY_PASS"
          printf '%s' "$ORDERS_RELEASE_STORE_B64" | base64 --decode > "$RUNNER_TEMP/orders-release.jks"
          echo "ORDERS_RELEASE_STORE_FILE=$RUNNER_TEMP/orders-release.jks" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_STORE_PASS=$ORDERS_RELEASE_STORE_PASS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_ALIAS=$ORDERS_RELEASE_ALIAS" >> "$GITHUB_ENV"
          echo "ORDERS_RELEASE_KEY_PASS=$ORDERS_RELEASE_KEY_PASS" >> "$GITHUB_ENV"
      - name: Test lint and build exact patch
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify release signer
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
